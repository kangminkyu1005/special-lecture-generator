  <rect x="150" y="1415" width="1505" height="755" rx="42" fill="#f3f4f6"/>
  <text x="210" y="1505" class="kr section">[ 특강 정보 ]</text>
  <text x="210" y="1580" class="kr body">특강 기간</text><text x="440" y="1580" class="kr value">[YYYY년 M월 D일 ~ M월 D일]</text>
  <text x="210" y="1650" class="kr body">특강 요일</text><text x="440" y="1650" class="kr value">토요일 · 일요일</text>
  <text x="210" y="1720" class="kr body">특강 시간</text><text x="440" y="1720" class="kr value">오후 5시 ~ 오후 8시</text>
  <text x="210" y="1790" class="kr body">특강 횟수</text><text x="440" y="1790" class="kr value">[특강 횟수]회</text>
  <text x="210" y="1860" class="kr body">대상</text><text x="440" y="1860" class="kr value">[대상 학년 / 종목]</text>
  <text x="210" y="1930" class="kr body">특강비</text><text x="440" y="1930" class="kr value">[금액]원</text>
  <text x="210" y="2040" class="kr" font-size="34" font-weight="700" fill="#ef4444">※ 비용 청구는 별도 안내에 따라 진행됩니다.</text>
  <text x="2490" y="560" class="kr" font-size="74" font-weight="800">[YYYY]</text>
  <g transform="translate(1770,640)">
