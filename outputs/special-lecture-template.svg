    <g class="kr date" text-anchor="middle"><text x="75" y="205">[ ]</text><text x="175" y="205">[ ]</text><text x="275" y="205">[ ]</text><text x="375" y="205">[ ]</text><text x="475" y="205">[ ]</text><text x="575" y="205">[ ]</text><text x="675" y="205">[ ]</text><text x="75" y="285">[ ]</text><text x="175" y="285">[ ]</text><text x="275" y="285">[ ]</text><text x="375" y="285">[ ]</text><text x="475" y="285">[ ]</text><text x="575" y="285">[ ]</text><text x="675" y="285">[ ]</text></g>
    <rect x="35" y="345" width="665" height="220" rx="20" fill="#fff0cd"/>
    <text x="367" y="425" text-anchor="middle" class="kr" font-size="35" font-weight="800">특강 일정</text>
    <text x="367" y="490" text-anchor="middle" class="kr" font-size="34" font-weight="600">토·일  |  오후 5시 ~ 오후 8시</text>
  </g>
  <g transform="translate(2600,640)">
    <rect width="735" height="690" rx="30" fill="#fff" stroke="#bfc2ca" stroke-width="5"/>
    <text x="367" y="72" text-anchor="middle" class="kr month">[특강 종료월]</text>
    <g class="kr small" text-anchor="middle"><text x="75" y="132" fill="#f05237">일</text><text x="175" y="132">월</text><text x="275" y="132">화</text><text x="375" y="132">수</text><text x="475" y="132">목</text><text x="575" y="132">금</text><text x="675" y="132" fill="#2563eb">토</text></g>
    <g class="kr date" text-anchor="middle"><text x="75" y="205">[ ]</text><text x="175" y="205">[ ]</text><text x="275" y="205">[ ]</text><text x="375" y="205">[ ]</text><text x="475" y="205">[ ]</text><text x="575" y="205">[ ]</text><text x="675" y="205">[ ]</text><text x="75" y="285">[ ]</text><text x="175" y="285">[ ]</text><text x="275" y="285">[ ]</text><text x="375" y="285">[ ]</text><text x="475" y="285">[ ]</text><text x="575" y="285">[ ]</text><text x="675" y="285">[ ]</text></g>
    <rect x="35" y="345" width="665" height="220" rx="20" fill="#dff8f4"/>
    <text x="367" y="425" text-anchor="middle" class="kr" font-size="35" font-weight="800">대회 일정</text>
    <text x="367" y="490" text-anchor="middle" class="kr" font-size="34" font-weight="600">[대회 기간을 입력해 주세요]</text>
  </g>
  <g transform="translate(1800,1505)">
    <rect width="1535" height="665" rx="42" fill="#fbf8ff" stroke="#e8ddff" stroke-width="4"/>
    <text x="70" y="105" class="kr section" fill="#5224a6">신청 및 안내</text>
    <line x1="70" y1="142" x2="1465" y2="142" stroke="#dfd4f7" stroke-width="3"/>
    <text x="70" y="230" class="kr body">• 신청 마감: [신청 마감일]</text>
    <text x="70" y="310" class="kr body">• 신청 방법: [신청 방법]</text>
    <text x="70" y="390" class="kr body">• 문의: [문의처]</text>
    <text x="70" y="505" class="kr" font-size="34" font-weight="700" fill="#ef4444">※ 대회 참가자는 특강 일정 및 유의사항을 반드시 확인해 주세요.</text>
    <text x="70" y="575" class="kr" font-size="34" font-weight="700" fill="#ef4444">※ 특강 특성상 결석에 따른 보강·환불은 제한될 수 있습니다.</text>
