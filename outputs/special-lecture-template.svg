<svg xmlns="http://www.w3.org/2000/svg" width="3508" height="2480" viewBox="0 0 3508 2480">
  <defs>
    <style>
      .kr { font-family: 'Noto Sans KR','Malgun Gothic',sans-serif; fill:#16191d; }
      .title { font-size:130px; font-weight:800; letter-spacing:-7px; }
      .sub { font-size:48px; font-weight:600; letter-spacing:-2px; }
      .section { font-size:45px; font-weight:800; }
      .body { font-size:38px; font-weight:500; letter-spacing:-1px; }
      .value { font-size:42px; font-weight:700; letter-spacing:-2px; }
      .small { font-size:31px; font-weight:500; }
      .month { font-size:40px; font-weight:800; }
      .date { font-size:31px; font-weight:600; }
    </style>
  </defs>
  <rect width="3508" height="2480" fill="#fafafa"/>
  <rect x="70" y="70" width="3368" height="2340" rx="8" fill="#ffffff" stroke="#5224a6" stroke-width="16"/>
  <rect x="112" y="112" width="200" height="200" rx="24" fill="#1db5e8"/>
  <text x="212" y="193" text-anchor="middle" class="kr" font-size="45" font-weight="900" fill="#fff">PLAY</text>
  <text x="212" y="244" text-anchor="middle" class="kr" font-size="45" font-weight="900" fill="#fff">WELL</text>
  <text x="385" y="203" class="kr title">[대회명]</text>
  <text x="385" y="335" class="kr title">대회 및 특강 안내</text>
  <rect x="2350" y="145" width="900" height="170" rx="85" fill="#f1ebff"/>
  <text x="2800" y="255" text-anchor="middle" class="kr" font-size="62" font-weight="800" fill="#5224a6">특강 일정표</text>
  <line x1="150" y1="420" x2="3358" y2="420" stroke="#e6e7ec" stroke-width="6"/>
  <text x="160" y="525" class="kr sub">[대회 기간]에 진행되는 [대회명] 대회를 대비한 특강을 아래와 같이 안내드립니다.</text>
  <rect x="150" y="600" width="1505" height="745" rx="42" fill="#f3f4f6"/>
  <text x="210" y="690" class="kr section">[ 대회 정보 ]</text>
  <text x="210" y="765" class="kr body">대회명</text><text x="440" y="765" class="kr value">[대회명]</text>
  <text x="210" y="835" class="kr body">대회 기간</text><text x="440" y="835" class="kr value">[YYYY년 M월 D일 ~ M월 D일]</text>
  <text x="210" y="905" class="kr body">장소</text><text x="440" y="905" class="kr value">[대회 장소]</text>
  <text x="210" y="975" class="kr body">종목</text><text x="440" y="975" class="kr value">[대회 종목 / 부문]</text>
  <line x1="210" y1="1025" x2="1595" y2="1025" stroke="#d7d9df" stroke-width="3"/>
