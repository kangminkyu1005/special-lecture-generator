<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">플레이웰 특강 안내문 생성기</title>
  <desc id="desc">민트색 배경 위에 특강과 대회 일정을 표시한 달력 아이콘</desc>
  <defs>
    <linearGradient id="background" x1="80" y1="48" x2="432" y2="464" gradientUnits="userSpaceOnUse">
      <stop stop-color="#56BCA7"/>
      <stop offset="1" stop-color="#038B78"/>
    </linearGradient>
    <filter id="shadow" x="50" y="60" width="412" height="416" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#001E41" flood-opacity=".2"/>
    </filter>
    <clipPath id="calendarClip">
      <rect x="88" y="82" width="336" height="350" rx="58"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" rx="112" fill="#FDF7EE"/>
  <rect x="24" y="24" width="464" height="464" rx="96" fill="url(#background)"/>

  <g filter="url(#shadow)">
    <rect x="88" y="82" width="336" height="350" rx="58" fill="#FFFDF9" stroke="#001E41" stroke-width="16"/>
    <g clip-path="url(#calendarClip)">
      <rect x="88" y="82" width="336" height="104" fill="#43A696"/>
      <rect x="88" y="170" width="336" height="16" fill="#001E41" opacity=".12"/>
    </g>
  </g>

  <rect x="146" y="62" width="32" height="72" rx="16" fill="#001E41"/>
  <rect x="334" y="62" width="32" height="72" rx="16" fill="#001E41"/>
  <circle cx="162" cy="112" r="8" fill="#FDF7EE" opacity=".85"/>
  <circle cx="350" cy="112" r="8" fill="#FDF7EE" opacity=".85"/>

  <g fill="#001E41" opacity=".18">
    <rect x="128" y="218" width="56" height="46" rx="14"/>
    <rect x="228" y="218" width="56" height="46" rx="14"/>
    <rect x="328" y="218" width="56" height="46" rx="14"/>
    <rect x="128" y="290" width="56" height="46" rx="14"/>
    <rect x="228" y="290" width="56" height="46" rx="14"/>
    <rect x="328" y="290" width="56" height="46" rx="14"/>
    <rect x="128" y="362" width="56" height="30" rx="12"/>
    <rect x="328" y="362" width="56" height="30" rx="12"/>
  </g>

  <rect x="228" y="218" width="56" height="46" rx="14" fill="#FDCD34"/>
  <rect x="128" y="290" width="56" height="46" rx="14" fill="#FDCD34"/>
  <rect x="328" y="290" width="56" height="46" rx="14" fill="#FD744D"/>
  <rect x="228" y="362" width="56" height="30" rx="12" fill="#2569C0"/>
</svg>
